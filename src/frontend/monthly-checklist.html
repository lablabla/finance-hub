<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Collector · Monthly Checklist</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400;500&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #f5f2eb;
  --bg2:      #ede9df;
  --bg3:      #e4dfd3;
  --ink:      #1a1612;
  --ink2:     #4a4540;
  --ink3:     #8a837a;
  --rule:     #d4cfc6;
  --green:    #2d6a4f;
  --green-bg: #d8f3dc;
  --amber:    #b5451b;
  --amber-bg: #fde8df;
  --blue:     #1a3a5c;
  --blue-bg:  #dbeafe;
  --red:      #991b1b;
  --red-bg:   #fee2e2;
  --sans:     'Syne', sans-serif;
  --mono:     'JetBrains Mono', monospace;
  --radius:   10px;
  --shadow:   0 1px 3px rgba(26,22,18,0.08), 0 4px 16px rgba(26,22,18,0.05);
}

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  min-height: 100vh;
  padding: 0;
}

/* grain overlay */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: 0.035;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  z-index: 9999;
}

/* ── Layout ── */
.app { display: flex; min-height: 100vh; }

.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--ink);
  color: #f5f2eb;
  padding: 32px 24px;
  display: flex;
  flex-direction: column;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.main {
  flex: 1;
  padding: 40px 48px;
  max-width: 860px;
}

/* ── Sidebar ── */
.logo {
  font-size: 11px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,242,235,0.4);
  font-family: var(--mono);
  margin-bottom: 8px;
}

.logo-title {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;
  margin-bottom: 40px;
  color: #f5f2eb;
}

.nav-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(245,242,235,0.35);
  margin-bottom: 10px;
  margin-top: 28px;
}

.nav-month {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 12px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  transition: background 0.15s;
  color: rgba(245,242,235,0.7);
  margin-bottom: 2px;
  gap: 8px;
}

.nav-month:hover { background: rgba(245,242,235,0.08); }
.nav-month.active { background: rgba(245,242,235,0.14); color: #f5f2eb; }

.nav-month-name { flex: 1; }

.nav-month-badge {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 20px;
}

.badge-done { background: var(--green); color: #d8f3dc; }
.badge-partial { background: rgba(181,69,27,0.5); color: #fde8df; }
.badge-empty { background: rgba(245,242,235,0.1); color: rgba(245,242,235,0.4); }

.sidebar-footer {
  margin-top: auto;
  padding-top: 24px;
  border-top: 1px solid rgba(245,242,235,0.1);
  font-family: var(--mono);
  font-size: 10px;
  color: rgba(245,242,235,0.3);
}

/* ── Header ── */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  margin-bottom: 36px;
  gap: 24px;
  flex-wrap: wrap;
}

.page-title {
  font-size: 32px;
  font-weight: 800;
  line-height: 1;
  color: var(--ink);
}

.page-sub {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--ink3);
  margin-top: 6px;
}

.progress-ring-wrap {
  display: flex;
  align-items: center;
  gap: 14px;
}

.ring-label {
  text-align: right;
}

.ring-pct {
  font-size: 28px;
  font-weight: 800;
  color: var(--ink);
  line-height: 1;
}

.ring-sub {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  margin-top: 3px;
}

/* ── Stats bar ── */
.stats-bar {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 32px;
}

.stat-card {
  background: white;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 16px 18px;
  box-shadow: var(--shadow);
}

.stat-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 8px;
}

.stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--ink);
}

.stat-value.green { color: var(--green); }
.stat-value.amber { color: var(--amber); }

/* ── Checklist ── */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  margin-top: 32px;
}

.section-title {
  font-size: 12px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ink3);
  font-family: var(--mono);
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 7px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  border: none;
  transition: all 0.15s;
}

.btn-primary {
  background: var(--ink);
  color: var(--bg);
}
.btn-primary:hover { background: var(--ink2); }

.btn-ghost {
  background: transparent;
  color: var(--ink2);
  border: 1px solid var(--rule);
}
.btn-ghost:hover { background: var(--bg2); }

.btn-danger {
  background: var(--red-bg);
  color: var(--red);
  border: 1px solid rgba(153,27,27,0.15);
  padding: 5px 10px;
  font-size: 11px;
}
.btn-danger:hover { background: #fecaca; }

.btn-sm {
  padding: 5px 10px;
  font-size: 11px;
}

/* ── Source Items ── */
.source-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 8px;
}

.source-item {
  background: white;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 16px 18px;
  display: flex;
  align-items: center;
  gap: 14px;
  box-shadow: var(--shadow);
  transition: transform 0.1s, box-shadow 0.1s;
  position: relative;
  overflow: hidden;
}

.source-item:hover { transform: translateY(-1px); box-shadow: 0 2px 8px rgba(26,22,18,0.1), 0 6px 20px rgba(26,22,18,0.07); }

.source-item.checked {
  background: #f8fffe;
  border-color: #a7d9b8;
}

.source-item.checked::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--green);
  border-radius: var(--radius) 0 0 var(--radius);
}

.source-item.api-source::before {
  background: var(--blue);
}

.source-item.api-source {
  background: #f8faff;
  border-color: #bcd0f0;
}

/* checkbox */
.check-btn {
  width: 26px;
  height: 26px;
  border-radius: 7px;
  border: 2px solid var(--rule);
  background: transparent;
  cursor: pointer;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  font-size: 13px;
}

.check-btn:hover { border-color: var(--green); background: var(--green-bg); }
.check-btn.checked { background: var(--green); border-color: var(--green); color: white; }
.check-btn.api-auto { background: var(--blue); border-color: var(--blue); color: white; cursor: default; font-size: 11px; }

.source-info { flex: 1; min-width: 0; }

.source-name {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 2px;
}

.source-meta {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
}

.source-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 20px;
  font-family: var(--mono);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}

.tag-manual { background: var(--amber-bg); color: var(--amber); }
.tag-api    { background: var(--blue-bg);  color: var(--blue); }
.tag-bank   { background: var(--bg2); color: var(--ink2); }
.tag-pension { background: #ede9fe; color: #5b21b6; }
.tag-invest { background: #fef9c3; color: #854d0e; }
.tag-insurance { background: #fce7f3; color: #9d174d; }

.source-date {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  text-align: right;
  flex-shrink: 0;
}

.source-date-val {
  color: var(--green);
  font-weight: 500;
}

.source-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}

/* ── Add source form ── */
.add-form {
  background: white;
  border: 1px dashed var(--rule);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 8px;
  display: none;
}

.add-form.open { display: block; }

.form-grid {
  display: grid;
  grid-template-columns: 2fr 1fr 1fr;
  gap: 12px;
  margin-bottom: 14px;
}

.form-field { display: flex; flex-direction: column; gap: 5px; }

.form-label {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink3);
}

.form-input, .form-select {
  padding: 8px 12px;
  border: 1px solid var(--rule);
  border-radius: 7px;
  font-family: var(--sans);
  font-size: 13px;
  background: var(--bg);
  color: var(--ink);
  outline: none;
  transition: border-color 0.15s;
}

.form-input:focus, .form-select:focus {
  border-color: var(--ink2);
}

.form-actions {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
}

/* ── Month nav ── */
.month-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  background: white;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  padding: 12px 16px;
  box-shadow: var(--shadow);
}

.month-nav-btn {
  width: 32px;
  height: 32px;
  border-radius: 7px;
  border: 1px solid var(--rule);
  background: transparent;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  color: var(--ink2);
  transition: all 0.12s;
}
.month-nav-btn:hover { background: var(--bg2); }

.month-nav-label {
  flex: 1;
  text-align: center;
  font-size: 16px;
  font-weight: 700;
}

.month-nav-today {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--ink3);
  padding: 4px 10px;
  border: 1px solid var(--rule);
  border-radius: 20px;
  cursor: pointer;
  background: transparent;
  transition: all 0.12s;
}
.month-nav-today:hover { background: var(--bg2); }

/* ── Divider ── */
.divider {
  height: 1px;
  background: var(--rule);
  margin: 28px 0;
}

/* ── Empty state ── */
.empty-state {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink3);
  font-size: 13px;
}

.empty-icon { font-size: 32px; margin-bottom: 12px; }

/* ── Notes ── */
.notes-area {
  width: 100%;
  min-height: 80px;
  padding: 12px;
  border: 1px solid var(--rule);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 12px;
  background: var(--bg);
  color: var(--ink);
  resize: vertical;
  outline: none;
  transition: border-color 0.15s;
}
.notes-area:focus { border-color: var(--ink2); }

/* ── Toast ── */
.toast-wrap {
  position: fixed;
  bottom: 28px;
  right: 28px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  z-index: 1000;
}

.toast {
  background: var(--ink);
  color: var(--bg);
  padding: 12px 18px;
  border-radius: 8px;
  font-family: var(--mono);
  font-size: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  animation: slideIn 0.2s ease;
}

@keyframes slideIn {
  from { transform: translateX(20px); opacity: 0; }
  to   { transform: translateX(0);    opacity: 1; }
}

/* ── SVG ring ── */
.progress-ring { transform: rotate(-90deg); }
.ring-bg { fill: none; stroke: var(--rule); stroke-width: 4; }
.ring-fill { fill: none; stroke: var(--green); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }

/* ── Confirm dialog ── */
.overlay {
  position: fixed;
  inset: 0;
  background: rgba(26,22,18,0.5);
  z-index: 500;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.overlay.open { opacity: 1; pointer-events: all; }

.dialog {
  background: white;
  border-radius: 12px;
  padding: 28px;
  max-width: 360px;
  width: 90%;
  box-shadow: 0 20px 60px rgba(0,0,0,0.2);
}
.dialog-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.dialog-body { font-size: 13px; color: var(--ink2); margin-bottom: 20px; }
.dialog-actions { display: flex; gap: 8px; justify-content: flex-end; }

@media (max-width: 700px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: static; }
  .main { padding: 24px 16px; }
  .stats-bar { grid-template-columns: 1fr 1fr; }
  .form-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="app">

  <!-- ── Sidebar ── -->
  <nav class="sidebar" id="sidebar">
    <div class="logo">Finance Hub</div>
    <div class="logo-title">Collection<br>Tracker</div>

    <div class="nav-label">Year 2026</div>
    <div id="month-nav-list"></div>

    <div class="sidebar-footer" id="sidebar-footer"></div>
  </nav>

  <!-- ── Main ── -->
  <main class="main">

    <!-- Month nav -->
    <div class="month-nav">
      <button class="month-nav-btn" onclick="shiftMonth(-1)">‹</button>
      <div class="month-nav-label" id="month-title"></div>
      <button class="month-nav-today" onclick="goToToday()">Today</button>
      <button class="month-nav-btn" onclick="shiftMonth(1)">›</button>
    </div>

    <!-- Header -->
    <div class="page-header">
      <div>
        <div class="page-title" id="header-title"></div>
        <div class="page-sub" id="header-sub"></div>
      </div>
      <div class="progress-ring-wrap">
        <div class="ring-label">
          <div class="ring-pct" id="ring-pct">0%</div>
          <div class="ring-sub" id="ring-sub">complete</div>
        </div>
        <svg width="56" height="56">
          <circle class="ring-bg" cx="28" cy="28" r="22"/>
          <circle class="ring-fill" cx="28" cy="28" r="22" id="ring-fill"
            stroke-dasharray="138.2" stroke-dashoffset="138.2"/>
        </svg>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">Total Sources</div>
        <div class="stat-value" id="stat-total">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Collected</div>
        <div class="stat-value green" id="stat-done">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value amber" id="stat-pending">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Auto (API)</div>
        <div class="stat-value" id="stat-api">—</div>
      </div>
    </div>

    <!-- API sources -->
    <div class="section-head">
      <div class="section-title">🔌 API — Automatic</div>
    </div>
    <div class="source-list" id="api-list"></div>

    <div class="divider"></div>

    <!-- Manual sources -->
    <div class="section-head">
      <div class="section-title">📥 Manual — Download Required</div>
      <button class="btn btn-primary btn-sm" onclick="toggleAddForm()">
        + Add Source
      </button>
    </div>

    <div class="source-list" id="manual-list"></div>

    <!-- Add form -->
    <div class="add-form" id="add-form">
      <div class="form-grid">
        <div class="form-field">
          <label class="form-label">Source Name</label>
          <input class="form-input" id="f-name" placeholder="e.g. Migdal Pension" />
        </div>
        <div class="form-field">
          <label class="form-label">Category</label>
          <select class="form-select" id="f-cat">
            <option value="bank">Bank</option>
            <option value="credit">Credit Card</option>
            <option value="pension">Pension</option>
            <option value="invest">Investment</option>
            <option value="insurance">Insurance</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div class="form-field">
          <label class="form-label">Format</label>
          <select class="form-select" id="f-fmt">
            <option value="CSV">CSV</option>
            <option value="PDF">PDF</option>
            <option value="Excel">Excel</option>
            <option value="Any">Any</option>
          </select>
        </div>
      </div>
      <div class="form-grid" style="grid-template-columns:1fr 1fr">
        <div class="form-field">
          <label class="form-label">Portal URL (optional)</label>
          <input class="form-input" id="f-url" placeholder="https://..." />
        </div>
        <div class="form-field">
          <label class="form-label">Notes (optional)</label>
          <input class="form-input" id="f-notes" placeholder="e.g. Login with ID number" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn btn-ghost" onclick="toggleAddForm()">Cancel</button>
        <button class="btn btn-primary" onclick="addSource()">Add Source</button>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Month notes -->
    <div class="section-head">
      <div class="section-title">📝 Month Notes</div>
    </div>
    <textarea class="notes-area" id="month-notes"
      placeholder="Any notes for this month — missing data, anomalies, reminders..."
      oninput="saveNotes()"></textarea>

  </main>
</div>

<!-- Confirm dialog -->
<div class="overlay" id="confirm-overlay">
  <div class="dialog">
    <div class="dialog-title" id="dialog-title">Remove source?</div>
    <div class="dialog-body" id="dialog-body"></div>
    <div class="dialog-actions">
      <button class="btn btn-ghost" onclick="closeDialog()">Cancel</button>
      <button class="btn btn-danger" onclick="confirmDialog()">Remove</button>
    </div>
  </div>
</div>

<!-- Toasts -->
<div class="toast-wrap" id="toasts"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────

const MONTHS = ['January','February','March','April','May','June',
                'July','August','September','October','November','December'];

const CATEGORY_META = {
  bank:      { label: 'Bank',       class: 'tag-bank'      },
  credit:    { label: 'Credit Card', class: 'tag-bank'     },
  pension:   { label: 'Pension',    class: 'tag-pension'   },
  invest:    { label: 'Investment', class: 'tag-invest'    },
  insurance: { label: 'Insurance',  class: 'tag-insurance' },
  other:     { label: 'Other',      class: 'tag-bank'      },
};

function loadState() {
  try { return JSON.parse(localStorage.getItem('financeCollector') || 'null'); } catch { return null; }
}

function saveState() {
  localStorage.setItem('financeCollector', JSON.stringify(state));
}

const DEFAULT_API_SOURCES = [
  { id: 'etrade', name: 'E*TRADE', category: 'invest', format: 'API',
    url: 'https://developer.etrade.com', notes: 'OAuth — auto-synced every 15 min' }
];

const DEFAULT_MANUAL_SOURCES = [
  { id: 'otzar',    name: 'Otzar HaHayal',    category: 'bank',      format: 'CSV',  url: 'https://www.otsarhahayal.co.il', notes: 'Export last 30 days transactions' },
  { id: 'visacal',  name: 'Visa Cal',          category: 'credit',    format: 'CSV',  url: 'https://www.cal-online.co.il',   notes: 'Monthly statement' },
  { id: 'harel-p',  name: 'Harel – Pension',   category: 'pension',   format: 'PDF',  url: 'https://www.harel-group.co.il',  notes: 'Monthly pension fund statement' },
  { id: 'harel-k',  name: 'Harel – Keren Hishtalmut', category: 'pension', format: 'PDF', url: 'https://www.harel-group.co.il', notes: 'Study fund statement' },
  { id: 'excellence', name: 'Excellence Investments', category: 'invest', format: 'PDF', url: 'https://www.excellence.co.il', notes: 'Investment portfolio report' },
];

let stored = loadState();
let state = stored || {
  apiSources: DEFAULT_API_SOURCES,
  manualSources: DEFAULT_MANUAL_SOURCES,
  monthData: {},  // key: "2026-04" → { checks: {id: bool}, notes: '' }
  currentYear: new Date().getFullYear(),
  currentMonth: new Date().getMonth(),
};

// If first run, ensure currentMonth/Year are set
if (!state.currentYear) state.currentYear = new Date().getFullYear();
if (state.currentMonth === undefined) state.currentMonth = new Date().getMonth();

// ── Helpers ────────────────────────────────────────────────────────────────

function monthKey(y, m) { return `${y}-${String(m+1).padStart(2,'0')}`; }

function getMonthData(y, m) {
  const k = monthKey(y, m);
  if (!state.monthData[k]) state.monthData[k] = { checks: {}, notes: '' };
  return state.monthData[k];
}

function allManualIds() { return state.manualSources.map(s => s.id); }

function checkedCount(y, m) {
  const d = getMonthData(y, m);
  return allManualIds().filter(id => d.checks[id]).length;
}

function totalManual() { return state.manualSources.length; }

function progressFor(y, m) {
  const total = totalManual();
  if (total === 0) return 0;
  return Math.round((checkedCount(y, m) / total) * 100);
}

// ── Render ─────────────────────────────────────────────────────────────────

function render() {
  const y = state.currentYear;
  const m = state.currentMonth;
  const d = getMonthData(y, m);
  const now = new Date();

  // Sidebar month list
  const navList = document.getElementById('month-nav-list');
  navList.innerHTML = '';
  for (let i = 0; i < 12; i++) {
    const pct = progressFor(y, i);
    const total = totalManual();
    let badgeClass = 'badge-empty', badgeText = '—';
    if (total > 0) {
      if (pct === 100) { badgeClass = 'badge-done'; badgeText = '✓'; }
      else if (pct > 0) { badgeClass = 'badge-partial'; badgeText = `${pct}%`; }
      else { badgeText = '—'; }
    }
    const active = i === m ? 'active' : '';
    navList.innerHTML += `
      <div class="nav-month ${active}" onclick="goToMonth(${i})">
        <span class="nav-month-name">${MONTHS[i]}</span>
        <span class="nav-month-badge ${badgeClass}">${badgeText}</span>
      </div>`;
  }

  // Sidebar footer
  document.getElementById('sidebar-footer').textContent =
    `${state.manualSources.length + state.apiSources.length} sources configured`;

  // Month title
  document.getElementById('month-title').textContent = `${MONTHS[m]} ${y}`;
  document.getElementById('header-title').textContent = `${MONTHS[m]} ${y}`;

  const isCurrentMonth = (now.getFullYear() === y && now.getMonth() === m);
  document.getElementById('header-sub').textContent =
    isCurrentMonth ? `Current month · ${now.toLocaleDateString('en-GB', {day:'numeric',month:'long'})}` :
    (y === now.getFullYear() && m < now.getMonth()) ? 'Past month' : 'Future month';

  // Progress ring
  const pct = progressFor(y, m);
  document.getElementById('ring-pct').textContent = `${pct}%`;
  const circ = 2 * Math.PI * 22;
  const offset = circ - (pct / 100) * circ;
  document.getElementById('ring-fill').setAttribute('stroke-dashoffset', offset);
  const done = checkedCount(y, m);
  const total = totalManual();
  document.getElementById('ring-sub').textContent = `${done} / ${total} done`;

  // Stats
  document.getElementById('stat-total').textContent = total + state.apiSources.length;
  document.getElementById('stat-done').textContent = done;
  document.getElementById('stat-pending').textContent = total - done;
  document.getElementById('stat-api').textContent = state.apiSources.length;

  // API list
  const apiList = document.getElementById('api-list');
  if (state.apiSources.length === 0) {
    apiList.innerHTML = `<div class="empty-state"><div class="empty-icon">🔌</div>No API sources configured.</div>`;
  } else {
    apiList.innerHTML = state.apiSources.map(s => `
      <div class="source-item api-source">
        <div class="check-btn api-auto">⚡</div>
        <div class="source-info">
          <div class="source-name">${s.name}</div>
          <div class="source-meta">
            <span class="source-tag tag-api">API</span>
            <span class="source-tag ${CATEGORY_META[s.category]?.class || 'tag-bank'}">${CATEGORY_META[s.category]?.label || s.category}</span>
            <span>${s.notes}</span>
          </div>
        </div>
        <div class="source-date">
          <div style="color:var(--blue);font-weight:500">Auto-synced</div>
          ${s.url ? `<div style="margin-top:4px"><a href="${s.url}" target="_blank" style="color:var(--ink3);font-size:9px;text-decoration:none">↗ portal</a></div>` : ''}
        </div>
        <div class="source-actions">
          <button class="btn btn-danger" onclick="askRemoveApi('${s.id}')">✕</button>
        </div>
      </div>`).join('');
  }

  // Manual list
  const manualList = document.getElementById('manual-list');
  if (state.manualSources.length === 0) {
    manualList.innerHTML = `<div class="empty-state"><div class="empty-icon">📭</div>No manual sources yet. Add one above.</div>`;
  } else {
    manualList.innerHTML = state.manualSources.map(s => {
      const checked = !!d.checks[s.id];
      const checkedDate = d.checkDates?.[s.id];
      return `
        <div class="source-item ${checked ? 'checked' : ''}">
          <button class="check-btn ${checked ? 'checked' : ''}" onclick="toggleCheck('${s.id}')">
            ${checked ? '✓' : ''}
          </button>
          <div class="source-info">
            <div class="source-name" style="${checked ? 'text-decoration:line-through;opacity:0.6' : ''}">${s.name}</div>
            <div class="source-meta">
              <span class="source-tag tag-manual">Manual</span>
              <span class="source-tag ${CATEGORY_META[s.category]?.class || 'tag-bank'}">${CATEGORY_META[s.category]?.label || s.category}</span>
              <span>${s.format}</span>
              ${s.notes ? `<span style="color:var(--ink3)">${s.notes}</span>` : ''}
            </div>
          </div>
          <div class="source-date">
            ${checked
              ? `<div class="source-date-val">✓ ${checkedDate || 'done'}</div>`
              : `<div style="color:var(--amber)">Pending</div>`}
            ${s.url ? `<div style="margin-top:4px"><a href="${s.url}" target="_blank" style="color:var(--ink3);font-size:9px;text-decoration:none">↗ portal</a></div>` : ''}
          </div>
          <div class="source-actions">
            <button class="btn btn-danger" onclick="askRemoveManual('${s.id}')">✕</button>
          </div>
        </div>`;
    }).join('');
  }

  // Notes
  document.getElementById('month-notes').value = d.notes || '';

  saveState();
}

// ── Actions ────────────────────────────────────────────────────────────────

function toggleCheck(id) {
  const y = state.currentYear, m = state.currentMonth;
  const d = getMonthData(y, m);
  if (!d.checkDates) d.checkDates = {};
  if (d.checks[id]) {
    d.checks[id] = false;
    delete d.checkDates[id];
    toast('Marked as pending');
  } else {
    d.checks[id] = true;
    d.checkDates[id] = new Date().toLocaleDateString('en-GB', {day:'numeric', month:'short'});
    toast('✓ Marked as collected!');
  }
  render();
}

function saveNotes() {
  const y = state.currentYear, m = state.currentMonth;
  const d = getMonthData(y, m);
  d.notes = document.getElementById('month-notes').value;
  saveState();
}

function shiftMonth(delta) {
  state.currentMonth += delta;
  if (state.currentMonth > 11) { state.currentMonth = 0; state.currentYear++; }
  if (state.currentMonth < 0)  { state.currentMonth = 11; state.currentYear--; }
  render();
}

function goToMonth(m) { state.currentMonth = m; render(); }

function goToToday() {
  state.currentYear = new Date().getFullYear();
  state.currentMonth = new Date().getMonth();
  render();
}

let formOpen = false;
function toggleAddForm() {
  formOpen = !formOpen;
  document.getElementById('add-form').classList.toggle('open', formOpen);
  if (formOpen) document.getElementById('f-name').focus();
}

function addSource() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) { toast('⚠ Please enter a source name'); return; }
  const cat  = document.getElementById('f-cat').value;
  const fmt  = document.getElementById('f-fmt').value;
  const url  = document.getElementById('f-url').value.trim();
  const notes = document.getElementById('f-notes').value.trim();
  const id = 'src-' + Date.now();
  state.manualSources.push({ id, name, category: cat, format: fmt, url, notes });
  ['f-name','f-url','f-notes'].forEach(id => document.getElementById(id).value = '');
  formOpen = false;
  document.getElementById('add-form').classList.remove('open');
  toast(`Added: ${name}`);
  render();
}

// ── Confirm dialog ─────────────────────────────────────────────────────────

let _pendingConfirm = null;

function askRemoveManual(id) {
  const src = state.manualSources.find(s => s.id === id);
  document.getElementById('dialog-title').textContent = `Remove "${src?.name}"?`;
  document.getElementById('dialog-body').textContent =
    'This will remove the source from all months. Collected data for past months is preserved.';
  _pendingConfirm = () => {
    state.manualSources = state.manualSources.filter(s => s.id !== id);
    toast(`Removed: ${src?.name}`);
    render();
  };
  document.getElementById('confirm-overlay').classList.add('open');
}

function askRemoveApi(id) {
  const src = state.apiSources.find(s => s.id === id);
  document.getElementById('dialog-title').textContent = `Remove "${src?.name}"?`;
  document.getElementById('dialog-body').textContent =
    'This will remove the API source from the tracker.';
  _pendingConfirm = () => {
    state.apiSources = state.apiSources.filter(s => s.id !== id);
    toast(`Removed: ${src?.name}`);
    render();
  };
  document.getElementById('confirm-overlay').classList.add('open');
}

function confirmDialog() {
  if (_pendingConfirm) _pendingConfirm();
  _pendingConfirm = null;
  document.getElementById('confirm-overlay').classList.remove('open');
}

function closeDialog() {
  _pendingConfirm = null;
  document.getElementById('confirm-overlay').classList.remove('open');
}

document.getElementById('confirm-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('confirm-overlay')) closeDialog();
});

// ── Toast ──────────────────────────────────────────────────────────────────

function toast(msg) {
  const wrap = document.getElementById('toasts');
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  wrap.appendChild(el);
  setTimeout(() => el.remove(), 2800);
}

// ── Enter key on add form ──────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && formOpen) addSource();
  if (e.key === 'Escape') {
    if (formOpen) toggleAddForm();
    closeDialog();
  }
});

// ── Init ───────────────────────────────────────────────────────────────────
render();
</script>
</body>
</html>
