services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/data
    env_file: .env
    ports:
      - "3001:3001"

  nginx:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - backend
