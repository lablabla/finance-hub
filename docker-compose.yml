services:
  backend:
    build: ./backend
    container_name: finance-hub-backend
    restart: unless-stopped
    volumes:
      - ./backend/data:/data
    env_file: .env
    networks:
      - finance

  nginx:
    build: ./frontend
    container_name: finance-hub-nginx
    restart: unless-stopped
    ports:
      - "3002:80"          # NPM proxies to this; not exposed to the internet
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - finance

networks:
  finance:
    driver: bridge
